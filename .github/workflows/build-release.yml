name: Build XPI Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build XPI
        run: |
          VERSION=$(jq -r .version src/manifest.json)
          cd src
          zip -r "../pdf2md_v${VERSION}.xpi" .
          echo "XPI_FILE=pdf2md_v${VERSION}.xpi" >> $GITHUB_ENV

      - name: Upload XPI to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.XPI_FILE }}
