<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<style>
* { box-sizing: border-box; }
body { font-family: message-box; font-size: 1.1em; margin: 0; padding: 16px 20px; }
h2 { font-size: 0.85em; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.5; margin: 0 0 10px 0; padding-bottom: 4px; border-bottom: 1px solid currentColor; }
.section { margin-bottom: 20px; }
.row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
label { min-width: 130px; flex-shrink: 0; }
input[type="text"] { flex: 1; padding: 4px 7px; border: 1px solid ThreeDShadow; border-radius: 3px; background: Field; color: FieldText; font: inherit; }
select { padding: 4px 7px; border: 1px solid ThreeDShadow; border-radius: 3px; background: Field; color: FieldText; font: inherit; }
button { padding: 4px 10px; border: 1px solid ThreeDShadow; border-radius: 3px; background: ButtonFace; color: ButtonText; font: inherit; cursor: pointer; white-space: nowrap; }
.hint { font-size: 0.85em; opacity: 0.6; margin: -4px 0 8px 138px; }
.off { opacity: 0.4; pointer-events: none; }
#testStatus { font-size: 0.85em; padding: 2px 6px; border-radius: 3px; display: none; }
.ok { background: #d4edda; color: #155724; }
.err { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>
<div class="section">
  <h2>Python</h2>
  <div class="row">
    <label>Python path</label>
    <input type="text" id="pythonPath" placeholder="e.g. C:\Python311\python.exe" />
    <button id="browseBtn">Browse…</button>
    <button id="testBtn">Test</button>
    <span id="testStatus"></span>
  </div>
  <div class="hint">Full path to python.exe (Windows) or python3 (Mac/Linux)</div>
</div>
<div class="section">
  <h2>Conversion</h2>
  <div class="row">
    <label>Engine</label>
    <select id="engine">
      <option value="markitdown">MarkItDown (Microsoft)</option>
      <option value="docling">Docling (IBM) — coming soon</option>
    </select>
  </div>
</div>
<div class="section">
  <h2>Output</h2>
  <div class="row">
    <label>Custom folder</label>
    <input type="checkbox" id="useCustomDir" />
    <span>Save to custom directory</span>
  </div>
  <div class="hint">Default: .md is saved next to the PDF</div>
  <div class="row off" id="customDirRow">
    <label>Directory</label>
    <input type="text" id="customDir" placeholder="e.g. C:\Users\you\MD" />
    <button id="browseDirBtn">Browse…</button>
  </div>
</div>
</body>
</html>
